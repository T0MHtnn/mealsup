<!doctype html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/brand/icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#1F7A46" />
  <meta name="description" content="PWA pour gestion de menus et listes de course optimisées" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Karla:wght@400;700&display=swap"
    rel="stylesheet"
  />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <title>MealsUp - Smart Meal Planning</title>
  <script>
    // Apply the saved theme before React loads, to avoid a white flash in dark mode
    try {
      var theme = (JSON.parse(localStorage.getItem('mealsup-ui') || '{}').state || {}).theme || 'system'
      var dark = theme === 'dark' || (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
      if (dark) document.documentElement.classList.add('dark')
    } catch (e) {}
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
